# Streamlit app config. Theme block is Phase 0 of docs/archive/UI_ACTION_PLAN.md; the
# [server] section is Phase 4.
[theme]
base = "dark"
primaryColor = "#C0392B"
backgroundColor = "#0E1117"
secondaryBackgroundColor = "#1B1F27"
font = "sans serif"
baseRadius = "medium"

[server]
# Serve static/ (next to dashboard.py) at app/static/. Cached card art and
# deck covers live in static/image_cache/, so image grids link each image by
# URL instead of embedding its bytes in the page on every rerun.
enableStaticServing = true
